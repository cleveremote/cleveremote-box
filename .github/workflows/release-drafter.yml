name: Release Drafter

# À chaque PR mergée sur main : calcule la prochaine version et met à jour la release DRAFT.
# Aucun tag n'est créé ici : c'est la publication de la draft (bouton « Publish release »)
# qui crée le tag vX.Y.Z et déclenche le déploiement prd (workflow Deploy).

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Calcul de la prochaine version
  # ─────────────────────────────────────────────
  bump-version:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.new_version.outputs.new_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get latest stable tag
        id: get_tag
        # Ignore les tags -dev.N / -rc.N
        run: |
          TAG=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          TAG=${TAG:-v0.0.0}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Latest stable tag: $TAG"

      - name: Determine bump type from source branch
        id: get_bump
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Merged branch: $BRANCH_NAME"

          if [[ "$BRANCH_NAME" == fix/* ]]; then
            echo "type=patch" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH_NAME" == feature/* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH_NAME" == new/* || "$BRANCH_NAME" == breaking/* ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Get current draft version
        id: get_draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRAFT=$(gh release list --repo ${{ github.repository }} --limit 50 \
            --json tagName,isDraft --jq '[.[] | select(.isDraft) | .tagName][0] // ""')
          echo "draft=$DRAFT" >> $GITHUB_OUTPUT
          echo "Current draft: ${DRAFT:-none}"

      - name: Calculate new version
        id: new_version
        env:
          OLD_VERSION: ${{ steps.get_tag.outputs.tag }}
          TYPE: ${{ steps.get_bump.outputs.type }}
          DRAFT: ${{ steps.get_draft.outputs.draft }}
        run: |
          VERSION=${OLD_VERSION#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "$TYPE" in
            patch) PATCH=$((PATCH + 1)) ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
          esac

          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"

          # Plusieurs PR mergées avant publication : on garde le plus gros bump.
          # Ex. draft v1.19.0 (feature) puis merge d'un fix → reste v1.19.0.
          if [[ "$DRAFT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            NEW_VERSION=$(printf '%s\n%s\n' "$NEW_VERSION" "$DRAFT" | sort -V | tail -1)
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Computed new version: $NEW_VERSION"

  # ─────────────────────────────────────────────
  # JOB 2 — Création / mise à jour de la DRAFT
  # ─────────────────────────────────────────────
  create-draft-release:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    needs: bump-version

    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter-config.yml
          disable-autolabeler: true
          commitish: main
          name: ${{ needs.bump-version.outputs.new_version }}
          tag: ${{ needs.bump-version.outputs.new_version }}
          version: ${{ needs.bump-version.outputs.new_version }}
          publish: false   # ← reste en DRAFT ; « Publish release » = déploiement prd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
