name: Release Publisher

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag Git à publier (laisser vide pour utiliser le dernier tag)'
        required: false
        default: ''
        type: string
      environments:
        description: 'Environnements cibles (virgule-séparés : dev,prd,pprd,test)'
        required: false
        default: 'dev'
        type: string

permissions:
  contents: write
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Résolution du tag et des envs cibles
  # ─────────────────────────────────────────────
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      env_tags: ${{ steps.resolve.outputs.env_tags }}

    steps:
      - name: Checkout (pour accéder aux métadonnées du tag)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version & env tags
        id: resolve
        run: |
          # Résolution du tag : input ou dernier tag GitHub
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [[ -z "$INPUT_TAG" ]]; then
            VERSION=$(git describe --tags $(git rev-list --tags --max-count=1))
          else
            VERSION="$INPUT_TAG"
          fi

          # Résolution des environnements
          ENVS="${{ github.event.inputs.environments }}"
          if [[ -z "$ENVS" ]]; then
            ENV_TAGS='["dev"]'
          else
            ENV_TAGS=$(echo "$ENVS" | tr ',' '\n' | jq -Rsc 'split("\n") | map(select(length>0))')
          fi
          echo "env_tags=$ENV_TAGS" >> $GITHUB_OUTPUT

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"
          echo "Resolved env tags: $ENV_TAGS"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 2 — Publish the draft release
  # ─────────────────────────────────────────────
  publish-release:
    runs-on: ubuntu-latest
    needs: resolve

    steps:
      - name: Publish draft release
        run: gh release edit ${{ needs.resolve.outputs.version }} --draft=false --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 3 — Build & push image Docker vers ECR
  # ─────────────────────────────────────────────
  deploy:
    name: Build & Push to ECR
    needs: [resolve, publish-release]
    uses: ./.github/workflows/deploy-ecr.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      env-tags: ${{ needs.resolve.outputs.env_tags }}
      aws-region: eu-west-3
      ecr-repository: cleveremote/clv-box
    secrets: inherit

  # ─────────────────────────────────────────────
  # JOB 4 — Build SEA & upload vers S3 (test)
  # ─────────────────────────────────────────────
  deploy-sea-s3:
    name: Deploy SEA to S3
    needs: [resolve, publish-release]
    uses: ./.github/workflows/deploy-sea-s3.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      aws-region: eu-west-3
      container-name: clv-box
    secrets: inherit
